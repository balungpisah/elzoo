name: Gleam

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gleam-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gleam-hosted:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spikes/gleam_ui
    env:
      ImageOS: ubuntu24
      ERL_FLAGS: '+S 2:2 +SDcpu 1 +SDio 1'
    steps:
      - name: Verify the GitHub-hosted runner
        working-directory: /
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          echo "Hosted runner: $RUNNER_NAME"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install runtime libraries
        working-directory: /
        run: sudo python3 "$GITHUB_WORKSPACE/scripts/ci-install-runtime.py"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.1.2'
      - name: Report BEAM capacity
        run: |
          erl -noshell -eval 'io:format("BEAM schedulers=~p online=~p dirty_cpu=~p dirty_io=~p~n", [erlang:system_info(schedulers), erlang:system_info(schedulers_online), erlang:system_info(dirty_cpu_schedulers_online), erlang:system_info(dirty_io_schedulers)]), halt().'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - name: Install the pinned Gleam compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/setup.sh
      - run: npx --no-install playwright install-deps chromium
      - run: ./scripts/check.sh
      - name: Locked dependencies remain unchanged
        run: |
          git rev-parse --is-inside-work-tree
          git diff --exit-code HEAD -- manifest.toml package-lock.json
