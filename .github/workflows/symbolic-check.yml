          else
            echo "cgroup CPU sample unavailable"
          fi
          sed -n '1,5p' /proc/meminfo
          cat /proc/loadavg
  check-consumers:
    if: ${{ needs.check-plan.outputs.run == 'true' }}
    needs: check-plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      ImageOS: ubuntu24
      ERL_FLAGS: '+S 4:4 +SDcpu 1 +SDio 1'
    services:
