          export PGPASSWORD=postgres PGHOST=localhost PGUSER=postgres
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE elzoo_test LOGIN PASSWORD 'elzoo_test'"
          createdb -O elzoo_test elzoo_test
          echo 'ELZOO_TEST_DATABASE_URL=ecto://elzoo_test:elzoo_test@localhost/elzoo_test' >> "$GITHUB_ENV"
          psql -d elzoo_test -c 'SHOW server_version'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the pinned S3 test server binary
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/elzoo-minio-cache
          key: elzoo-minio-RELEASE.2025-09-07T16-13-09Z-7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      - name: Start the disposable S3 test server
        id: minio
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-minio.py
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.2'
      - name: Report BEAM capacity
        run: |
          erl -noshell -eval 'io:format("BEAM schedulers=~p online=~p dirty_cpu=~p dirty_io=~p~n", [erlang:system_info(schedulers), erlang:system_info(schedulers_online), erlang:system_info(dirty_cpu_schedulers_online), erlang:system_info(dirty_io_schedulers)]), halt().'
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
            spikes/ash_foundation/deps
            spikes/ash_foundation/_build
          key: elzoo-hosted-v1-${{ runner.os }}-${{ env.ImageOS }}-otp29.1.2-elixir1.20.4-${{ hashFiles('mix.lock', 'mix.exs', 'spikes/ash_foundation/mix.lock', 'spikes/ash_foundation/mix.exs') }}
          restore-keys: |
            elzoo-hosted-v1-${{ runner.os }}-${{ env.ImageOS }}-otp29.1.2-elixir1.20.4-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix setup
      - name: Run mix check
        run: sh scripts/run-ci-check.sh --part consumers-db
      - name: Report container resource observations
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            echo "cgroup memory peak bytes: $(cat /sys/fs/cgroup/memory.peak)"
          else
            echo "cgroup memory peak unavailable"
          fi
          if test -r "$RUNNER_TEMP/elzoo-ci-cpu.json"; then
