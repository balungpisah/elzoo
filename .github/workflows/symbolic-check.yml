  check-hosted:
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [check-plan, check-root, check-consumers-db, check-consumers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Verify the GitHub-hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          echo "Hosted runner: $RUNNER_NAME"
          free -h || true
      - name: Require every job
        env:
          PLAN: ${{ needs.check-plan.result }}
          RUN: ${{ needs.check-plan.outputs.run }}
          ROOT: ${{ needs.check-root.result }}
          DB: ${{ needs.check-consumers-db.result }}
          CONSUMERS: ${{ needs.check-consumers.result }}
        run: |
          echo "plan=$PLAN run=$RUN root=$ROOT consumers-db=$DB consumers=$CONSUMERS"
          test "$PLAN" = success
          if [ "$RUN" = true ]; then
            test "$ROOT" = success
            test "$DB" = success
            test "$CONSUMERS" = success
            echo "ELZOO CHECK PASSED"
          else
            test "$RUN" = false
            test "$ROOT" = skipped
            test "$DB" = skipped
            test "$CONSUMERS" = skipped
          fi
