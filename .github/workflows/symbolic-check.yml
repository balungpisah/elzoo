          else
            echo "cgroup CPU sample unavailable"
          fi
          sed -n '1,5p' /proc/meminfo
          cat /proc/loadavg

  check-hosted:
    if: ${{ vars.ELZOO_CI_LANE == 'hosted' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 120
    env:
      ImageOS: ubuntu24
      ERL_FLAGS: '+S 4:4 +SDcpu 1 +SDio 1'
    services:
      postgres:
        image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Verify the GitHub-hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          echo "Hosted runner: $RUNNER_NAME"
          free -h || true
      - name: Report host load and memory context
        run: |
          sed -n '1,5p' /proc/meminfo
          cat /proc/loadavg
          nproc
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libncurses6 libsctp1 libssl3
      - name: Prepare disposable PostgreSQL database
        run: |
          set -eu
          export PGPASSWORD=postgres PGHOST=localhost PGUSER=postgres
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE elzoo_test LOGIN PASSWORD 'elzoo_test'"
          createdb -O elzoo_test elzoo_test
          echo 'ELZOO_TEST_DATABASE_URL=ecto://elzoo_test:elzoo_test@localhost/elzoo_test' >> "$GITHUB_ENV"
          psql -d elzoo_test -c 'SHOW server_version'
