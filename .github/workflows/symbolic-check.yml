name: Check on user-owned CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: 'fast = fast runners only (merge queue, default); any = any backend runner (measurement runs)'
        type: choice
        options: [fast, any]
        default: fast

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-fast:
    if: ${{ vars.ELZOO_CI_LANE != 'hosted' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.tier == 'fast')) }}
    runs-on: [self-hosted, linux, x64, elzoo, backend, fast]
    container:
      image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    # ELZ-040: 45m exceeded/near-hit (runs 42342334978, 42340251145); see docs/development/10-symbolic-ci.md
    timeout-minutes: 90
    env:
      ImageOS: ubuntu24
      ERL_FLAGS: '+S 4:4 +SDcpu 1 +SDio 1'
    steps:
      - name: Verify approved backend runner
        run: |
          case "$RUNNER_NAME" in
            symbolic-elzoo) ;;
            macbook-ubuntu-elzoo-candidate)
              echo 'ERL_FLAGS=+S 2:2 +SDcpu 1 +SDio 1' >> "$GITHUB_ENV"
              ;;
            contabo-elzoo-1)
              echo 'ERL_FLAGS=+S 4:4 +SDcpu 1 +SDio 1' >> "$GITHUB_ENV"
              ;;
            *) echo "Unapproved backend runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
          echo "Backend runner: $RUNNER_NAME"
          free -h || true
      - name: Report host load and memory context
        run: |
          sed -n '1,5p' /proc/meminfo
          cat /proc/loadavg
      - name: Prepare Ubuntu job container
        working-directory: /
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git unzip python3 build-essential libssl3 libncurses6 libsctp1 postgresql
      - name: Prepare disposable PostgreSQL database
        working-directory: /
        run: |
          set -eu
          version=$(find /usr/lib/postgresql -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$version"
          if ! pg_lsclusters --no-header | awk '{print $1, $2}' | grep -qx "$version main"; then
            pg_createcluster "$version" main
          fi
          pg_ctlcluster "$version" main status || pg_ctlcluster "$version" main start
          su postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE ROLE elzoo_test LOGIN PASSWORD 'elzoo_test'\""
          su postgres -c "createdb -O elzoo_test elzoo_test"
          echo 'ELZOO_TEST_DATABASE_URL=ecto://elzoo_test:elzoo_test@localhost/elzoo_test' >> "$GITHUB_ENV"
          su postgres -c "psql -d elzoo_test -c 'SHOW server_version'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only this container checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
      - run: python3 scripts/check-claims.py
      - run: python3 scripts/check-ci-runners.py
      - run: python3 scripts/test-ci-runners.py
      - run: python3 scripts/test-merge-queue.py
      - run: python3 scripts/test-ci-minio.py
      - run: python3 scripts/test-ci-skip.py
      - name: Decide whether the full check is redundant
        id: skip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-skip-decision.py
      - name: Restore the pinned S3 test server binary
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/elzoo-minio-cache
          key: elzoo-minio-RELEASE.2025-09-07T16-13-09Z-7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      - name: Start the disposable S3 test server
        if: ${{ steps.skip.outputs.skip != 'true' }}
        id: minio
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-minio.py
      - name: Save the pinned S3 test server binary
        if: ${{ steps.skip.outputs.skip != 'true' && steps.minio.outputs.source != 'cache' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/elzoo-minio-cache
          key: elzoo-minio-RELEASE.2025-09-07T16-13-09Z-7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        if: ${{ steps.skip.outputs.skip != 'true' }}
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.2'
      - name: Report BEAM capacity
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          erl -noshell -eval 'io:format("BEAM schedulers=~p online=~p dirty_cpu=~p dirty_io=~p~n", [erlang:system_info(schedulers), erlang:system_info(schedulers_online), erlang:system_info(dirty_cpu_schedulers_online), erlang:system_info(dirty_io_schedulers)]), halt().'
      # ELZ-043: restore and save are split so dependency state is saved right after
      # mix setup, before mix check; a later failure or timeout keeps the saved cache.
      - name: Restore dependency cache
        if: ${{ steps.skip.outputs.skip != 'true' }}
        id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
            spikes/ash_foundation/deps
            spikes/ash_foundation/_build
          key: elzoo-ubuntu24-v2-${{ runner.name }}-${{ runner.os }}-otp29.1.2-elixir1.20.4-${{ hashFiles('mix.lock', 'mix.exs', 'spikes/ash_foundation/mix.lock', 'spikes/ash_foundation/mix.exs') }}
          restore-keys: |
            elzoo-ubuntu24-v2-${{ runner.name }}-${{ runner.os }}-otp29.1.2-elixir1.20.4-
      - run: mix local.hex --force
        if: ${{ steps.skip.outputs.skip != 'true' }}
      - run: mix local.rebar --force
        if: ${{ steps.skip.outputs.skip != 'true' }}
      - run: mix setup
        if: ${{ steps.skip.outputs.skip != 'true' }}
      - name: Save dependency cache after mix setup
        if: ${{ steps.deps-cache.outputs.cache-hit != 'true' && steps.skip.outputs.skip != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
            spikes/ash_foundation/deps
            spikes/ash_foundation/_build
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Run mix check
        if: ${{ steps.skip.outputs.skip != 'true' }}
        env:
          ELZOO_CHECK_EVENT: ${{ github.event_name }}
          ELZOO_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${ELZOO_CHECK_EVENT:-}" = pull_request ]; then
            sh scripts/run-ci-check.sh --affected "${ELZOO_CHECK_BASE:-}"
          else
            sh scripts/run-ci-check.sh
          fi
      - name: Report container resource observations
        if: always()
        run: |
          if test -r /sys/fs/cgroup/memory.peak; then
            echo "cgroup memory peak bytes: $(cat /sys/fs/cgroup/memory.peak)"
          else
            echo "cgroup memory peak unavailable"
          fi
          if test -r "$RUNNER_TEMP/elzoo-ci-cpu.json"; then
            cat "$RUNNER_TEMP/elzoo-ci-cpu.json"
          else
            echo "cgroup CPU sample unavailable"
          fi
          sed -n '1,5p' /proc/meminfo
          cat /proc/loadavg

  check-any:
    if: ${{ vars.ELZOO_CI_LANE != 'hosted' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'any')) }}
    runs-on: [self-hosted, linux, x64, elzoo, backend]
    permissions:
      actions: read
      contents: read
    container:
      image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    # ELZ-040: 45m exceeded/near-hit (runs 42342334978, 42340251145); see docs/development/10-symbolic-ci.md
    timeout-minutes: 90
    env:
      ImageOS: ubuntu24
      ERL_FLAGS: '+S 4:4 +SDcpu 1 +SDio 1'
    steps:
      - name: Verify approved backend runner
        run: |
          case "$RUNNER_NAME" in
            symbolic-elzoo) ;;
            macbook-ubuntu-elzoo-candidate)
              echo 'ERL_FLAGS=+S 2:2 +SDcpu 1 +SDio 1' >> "$GITHUB_ENV"
              ;;
            contabo-elzoo-1)
              echo 'ERL_FLAGS=+S 4:4 +SDcpu 1 +SDio 1' >> "$GITHUB_ENV"
              ;;
            *) echo "Unapproved backend runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
          echo "Backend runner: $RUNNER_NAME"
          free -h || true
      - name: Report host load and memory context
        run: |
          sed -n '1,5p' /proc/meminfo
          cat /proc/loadavg
      - name: Prepare Ubuntu job container
        working-directory: /
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git unzip python3 build-essential libssl3 libncurses6 libsctp1 postgresql
      - name: Prepare disposable PostgreSQL database
        working-directory: /
        run: |
          set -eu
          version=$(find /usr/lib/postgresql -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$version"
          if ! pg_lsclusters --no-header | awk '{print $1, $2}' | grep -qx "$version main"; then
            pg_createcluster "$version" main
          fi
          pg_ctlcluster "$version" main status || pg_ctlcluster "$version" main start
          su postgres -c "psql -v ON_ERROR_STOP=1 -c \"CREATE ROLE elzoo_test LOGIN PASSWORD 'elzoo_test'\""
          su postgres -c "createdb -O elzoo_test elzoo_test"
          echo 'ELZOO_TEST_DATABASE_URL=ecto://elzoo_test:elzoo_test@localhost/elzoo_test' >> "$GITHUB_ENV"
          su postgres -c "psql -d elzoo_test -c 'SHOW server_version'"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only this container checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
      - run: python3 scripts/check-claims.py
      - run: python3 scripts/check-ci-runners.py
      - run: python3 scripts/test-ci-runners.py
      - run: python3 scripts/test-merge-queue.py
      - run: python3 scripts/test-ci-minio.py
      - run: python3 scripts/test-ci-skip.py
      - name: Decide whether the full check is redundant
        id: skip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-skip-decision.py
      - name: Restore the pinned S3 test server binary
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/elzoo-minio-cache
          key: elzoo-minio-RELEASE.2025-09-07T16-13-09Z-7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      - name: Start the disposable S3 test server
        if: ${{ steps.skip.outputs.skip != 'true' }}
        id: minio
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-minio.py
      - name: Save the pinned S3 test server binary
        if: ${{ steps.skip.outputs.skip != 'true' && steps.minio.outputs.source != 'cache' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/elzoo-minio-cache
          key: elzoo-minio-RELEASE.2025-09-07T16-13-09Z-7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        if: ${{ steps.skip.outputs.skip != 'true' }}
