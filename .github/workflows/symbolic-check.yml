          nproc
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libncurses6 libsctp1 libssl3
      - name: Prepare disposable PostgreSQL database
